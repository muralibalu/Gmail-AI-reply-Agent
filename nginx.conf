server {
    listen 80;

    # ── Serve React app ───────────────────────────────────────────────────────
    # root = where our built files are
    root /usr/share/nginx/html;
    index index.html;

    # React Router fix: any route that isn't a real file gets index.html
    # Without this, refreshing /dashboard gives a 404 from Nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to backend ────────────────────────────────────────────
    # When the frontend calls /auth/* or /drafts/*, Nginx forwards it
    # to the backend container (named "backend" in docker-compose).
    # This means the frontend never needs to know the backend's IP.
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /drafts/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
